<!doctype html><html><head><meta charset="utf-8"><title>BookNote Reader</title>
<style>
:root{
--bg:#f4efe9;--app:#fff;--surface:#fff;--surface2:#fcfaf8;--nav:#f8f4f0;
--header:#f0e8e0;--text:#3d2e26;--text2:#5f4b3d;--muted:#8b7768;
--border:#d5c8bc;--border2:#e6ddd5;--hover:#ede5dc;--accent:#3d2e26;
--danger:#c44d4d;--star:#f5b342;--shadow:rgba(0,0,0,.09);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
.app{height:100vh;display:flex;overflow:hidden;background:var(--app)}
.nav{width:245px;min-width:245px;background:var(--nav);border-right:1px solid var(--border2);padding:14px 10px;display:flex;flex-direction:column;overflow:auto}
.nav-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.nav-head h2{font-size:17px;margin:0}
.nav-head button,.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--text)}
.nav-head button:hover,.iconbtn:hover{background:var(--hover)}
.nav-section{margin-bottom:12px}
.nav-section-title{font-size:12px;color:var(--muted);padding:5px 10px;text-transform:none}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--text2);margin:2px 0}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .count{margin-left:auto;font-size:11px;opacity:.7}
.category-list{border:1px solid var(--border);border-radius:10px;background:var(--surface2);overflow:hidden;margin-bottom:8px}.category{padding:7px 10px;border-bottom:1px solid var(--border2);cursor:pointer;display:flex;align-items:center;gap:7px}.category:last-child{border-bottom:0}.category:hover{background:var(--hover)}.category.active{font-weight:600;background:var(--hover)}.category .cat-count{margin-left:auto;color:var(--muted);font-size:11px}.miniadd{float:right;padding:1px 7px!important;font-size:14px!important;border-radius:7px!important}.cat-title{display:flex;align-items:center;justify-content:space-between}.book-list{border:1px solid var(--border);border-radius:10px;background:var(--surface2);overflow:hidden}

.category-manage-row{font-weight:600}\n.category-actions{margin-left:auto;display:flex;gap:2px;opacity:.75}
.category:hover .category-actions{opacity:1}
.category-action{border:0;background:transparent!important;padding:2px 4px!important;border-radius:5px!important;font-size:12px!important;cursor:pointer}
.category-action:hover{background:var(--hover)!important;transform:none!important}
.book{padding:7px 10px;border-bottom:1px solid var(--border2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book:last-child{border-bottom:0}.book:hover{background:var(--hover)}.book.active{font-weight:600;background:var(--hover)}
.main{min-width:0;flex:1;display:flex;flex-direction:column;background:var(--surface2)}
.toolbar{position:relative;z-index:100;overflow:visible;min-height:58px;padding:9px 14px;background:var(--nav);border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.title{font-size:18px;font-weight:600;white-space:nowrap;margin-right:5px}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 11px;color:var(--text);cursor:pointer}
button:hover{background:var(--hover);transform:translateY(-1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
.search{position:relative;display:flex;align-items:center;height:40px;box-sizing:border-box;width:min(790px,100%);background:var(--surface);border:1.5px solid var(--border);border-radius:22px;padding:0;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 14%,transparent)}
.search-leading{display:flex;align-items:center;justify-content:center;flex:0 0 46px;height:100%;color:var(--text);opacity:.9;pointer-events:none}
.search-leading svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.search input{flex:1 1 auto;min-width:0;width:auto;height:100%;box-sizing:border-box;border:0;outline:0;background:transparent;padding:0 42px 0 0;color:var(--text);font-size:16px;line-height:40px}
.search input::placeholder{color:var(--muted);opacity:1}
.search-clear{display:none;position:absolute;right:55px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0!important;border-radius:50%;padding:0!important;margin:0!important;background:transparent!important;color:var(--muted)!important;font-size:22px!important;font-weight:400!important;line-height:27px;cursor:pointer;z-index:2}
.search.has-value .search-clear{display:block}
.search-clear:hover{background:var(--hover)!important;color:var(--text)!important;transform:translateY(-50%)!important}
.search-submit{flex:0 0 58px;width:58px;height:100%;box-sizing:border-box;border:0!important;border-left:1px solid var(--border)!important;border-radius:0!important;background:transparent!important;padding:0!important;margin:0!important;color:var(--text)!important;line-height:1;cursor:pointer}
.search-submit:hover{background:var(--hover)!important;transform:none!important}
.search-submit svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.search-submit:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

.content{position:relative;z-index:1;flex:1;overflow:auto;padding:14px}
.status{padding:8px 11px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border2);border-radius:9px;color:var(--muted);font-size:12px}
.note{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px var(--shadow)}
.note.pinned{border-left:4px solid var(--accent)}.note.favorite{border-top:3px solid var(--star)}
.note-head{padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--border2);display:flex;align-items:flex-start;gap:10px}
.note-title{min-width:0;flex:1;font-weight:600}.note-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}.note-meta label{font-size:11px;color:var(--muted)}.note-meta input,.note-meta select{font:inherit;font-size:12px;border:1px solid var(--border);border-radius:7px;padding:5px 7px;background:var(--surface);color:var(--text);max-width:190px;outline:none}.note-meta input:focus,.note-meta select:focus{border-color:var(--accent)}.note-title .url{display:block;font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.badges{display:flex;gap:4px;flex-shrink:0}.badge{font-size:11px;padding:3px 7px;border-radius:12px;background:var(--hover);color:var(--text2)}
.note-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,1fr);gap:0}
.block{padding:12px;border-right:1px solid var(--border2)}.block:last-child{border-right:0}
.label{font-size:12px;color:var(--muted);margin-bottom:5px}
.excerpt-read-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0 0 7px 0}\n.excerpt-other-actions{margin-top:0}
.excerpt-read{font:inherit;font-size:11px;line-height:1.2;padding:5px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text);cursor:pointer;white-space:nowrap}
.excerpt-highlight-control{font:inherit;font-size:12px;line-height:1.2;min-width:28px;padding:5px 6px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text);cursor:pointer;white-space:nowrap}
.excerpt-highlight-control:hover{background:var(--hover);border-color:var(--accent)}
.excerpt-highlight-control:active{transform:translateY(1px)}
/* V7.3 — smart theme-aware excerpt highlighting */
.excerpt-highlight{
 padding:0 1px;border-radius:2px;
 background-color:var(--excerpt-hl-bg,var(--excerpt-highlight-base,#F3E7A6));
 color:var(--excerpt-hl-fg,var(--text));
 -webkit-box-decoration-break:clone;
 box-decoration-break:clone;
}
/* Day: preserve the original soft, low-saturation palette. */
body[data-mode="day"]{
 --excerpt-hl-yellow:#F3E7A6;--excerpt-hl-green:#C9DDC5;
 --excerpt-hl-blue:#C9DDE8;--excerpt-hl-purple:#D8CBE3;--excerpt-hl-red:#E7C8C2;
}
body[data-mode="day"] .excerpt-highlight[data-color="yellow"]{--excerpt-hl-bg:var(--excerpt-hl-yellow)}
body[data-mode="day"] .excerpt-highlight[data-color="green"]{--excerpt-hl-bg:var(--excerpt-hl-green)}
body[data-mode="day"] .excerpt-highlight[data-color="blue"]{--excerpt-hl-bg:var(--excerpt-hl-blue)}
body[data-mode="day"] .excerpt-highlight[data-color="purple"]{--excerpt-hl-bg:var(--excerpt-hl-purple)}
body[data-mode="day"] .excerpt-highlight[data-color="red"]{--excerpt-hl-bg:var(--excerpt-hl-red)}
/* Night: automatically use deeper, muted variants so light text remains readable. */
body[data-mode="night"]{
 --excerpt-hl-yellow:#6F6230;--excerpt-hl-green:#435C47;
 --excerpt-hl-blue:#3F5968;--excerpt-hl-purple:#554462;--excerpt-hl-red:#633F3D;
}
body[data-mode="night"] .excerpt-highlight[data-color="yellow"]{--excerpt-hl-bg:var(--excerpt-hl-yellow)}
body[data-mode="night"] .excerpt-highlight[data-color="green"]{--excerpt-hl-bg:var(--excerpt-hl-green)}
body[data-mode="night"] .excerpt-highlight[data-color="blue"]{--excerpt-hl-bg:var(--excerpt-hl-blue)}
body[data-mode="night"] .excerpt-highlight[data-color="purple"]{--excerpt-hl-bg:var(--excerpt-hl-purple)}
body[data-mode="night"] .excerpt-highlight[data-color="red"]{--excerpt-hl-bg:var(--excerpt-hl-red)}

.excerpt-highlight-control{font:inherit;font-size:12px;line-height:1.2;min-width:28px;padding:5px 6px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text);cursor:pointer;white-space:nowrap}
.excerpt-highlight-control:hover{background:var(--hover);border-color:var(--accent)}
.excerpt-highlight{padding:0 1px;border-radius:2px;color:inherit}
.excerpt-font-control{font:inherit;font-size:12px;font-weight:600;line-height:1.2;min-width:30px;padding:5px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text);cursor:pointer;white-space:nowrap}
.excerpt-font-control:hover{background:var(--hover);border-color:var(--accent)}
.excerpt-font-control:active{transform:translateY(1px)}

.excerpt-read:hover{background:var(--hover);border-color:var(--accent)}
.excerpt-read:active{transform:translateY(1px)}
.quote{background:var(--surface);color:var(--text);border-left:4px solid #e4c95b;padding:9px;white-space:pre-wrap;line-height:1.55;max-height:180px;overflow:auto}
textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--border);border-radius:9px;padding:9px;font:inherit;line-height:1.55;background:var(--surface);color:var(--text);outline:none}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--hover)}
.note-foot{padding:8px 10px;border-top:1px solid var(--border2);display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--surface2)}
.time{font-size:11px;color:var(--muted);margin-right:auto}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--accent);color:#fff;padding:9px 13px;border-radius:9px;box-shadow:0 8px 24px var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:none}
@media(max-width:800px){.nav{width:190px;min-width:190px}.note-grid{grid-template-columns:1fr}.block{border-right:0;border-bottom:1px solid var(--border2)}.search input{width:120px}}

/* V1.2.7: category view editing layout */
.main.category-view .note .note-grid{
  grid-template-columns:minmax(0,1fr) minmax(360px,1fr);
}
.main.category-view .note .block{
  padding:14px;
}
.main.category-view .note .quote{
  max-height:260px;
}
.main.category-view .note .text{
  min-height:400px;
  height:400px;
  resize:vertical;
}
.main.category-view .note-foot{
  position:sticky;
  bottom:0;
  z-index:6;
  box-shadow:0 -3px 10px rgba(0,0,0,.06);
}
.main.all-view .note-foot{
  position:relative;
}
@media(max-width:900px){
  .main.category-view .note-grid{grid-template-columns:1fr}
  .main.category-view .note .text{min-height:220px;height:220px}
}





/* V1.4.1 — cross-platform stable icons, no external font/webfont */
.ui-icon{
  display:inline-block;
  width:1.15em;
  margin-right:5px;
  text-align:center;
  font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols","DejaVu Sans",sans-serif;
  font-size:1em;
  line-height:1;
  vertical-align:-1px;
  font-weight:400;
}
.ui-icon.heart{font-size:1.05em}

/* V1.4.2 — collapsible navigation */
.nav.collapsed{width:58px;min-width:58px;padding:10px 7px}
.nav.collapsed .nav-section,
.nav.collapsed .nav-foot{display:none}
.nav.collapsed .brand-row{justify-content:center}
.nav.collapsed .brand-row h2{display:none}
.nav.collapsed .brand-actions{gap:0}
.nav.collapsed #refresh{display:none}
.nav.collapsed #navToggle{width:40px;min-width:40px;padding:5px!important}
.nav.collapsed #navToggle .nav-toggle-text{display:none}
.nav-toggle{width:100%;height:34px;padding:5px 8px!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.category-manage-panel{display:none;margin:8px 0 12px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface2)}
.category-manage-panel.open{display:block}
.category-manage-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.category-manage-body{display:flex;flex-direction:column;gap:5px}
.main.category-view .note .text{min-height:405px;height:405px;resize:vertical}
.main.category-view .note .block:last-child{min-height:440px}
@media(max-width:800px){
 .main.category-view .note .text{min-height:365px;height:365px}
 .main.category-view .note .block:last-child{min-height:400px}
}

/* V1.4.3 — four independent left sections + matched 405px panes */
.nav-section.collapsed .nav-section-body{display:none!important}
.nav-section-title.section-title{display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;user-select:none}
.section-title-main{display:flex;align-items:center;gap:5px}
.section-toggle{border:1px solid var(--border)!important;background:var(--surface)!important;border-radius:7px!important;padding:1px 7px!important;min-width:30px;line-height:1.4}
.section-toggle:hover{background:var(--hover)!important}
.main.category-view .note .quote{height:405px;min-height:405px;max-height:405px;overflow:auto}
.main.category-view .note .text{min-height:405px;height:405px;max-height:none;resize:vertical}
.main.category-view .note .block{min-height:440px}
.category-group-title{
 font-size:12px;font-weight:700;color:var(--text);padding:8px 10px 4px;
}
.document-category-title{border-top:1px solid var(--border);margin-top:6px;padding-top:9px}
/* V7.10.49：导入文档管理独立管理框，便于多文件导入后集中管理。 */
.document-management-box{
  margin-top:8px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  overflow:hidden;
}
.document-management-head{
  min-height:32px;
  padding:4px 7px 4px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.document-management-title{font-size:13px;font-weight:700;line-height:1.35;}
.document-management-toggle{
  flex:0 0 30px!important;
  width:30px!important;
  min-width:30px!important;
  height:26px!important;
  padding:1px 6px!important;
}
.document-management-body{padding:2px 5px 5px;}
 .document-management-items{margin-top:5px;border-top:1px solid var(--border);padding-top:4px;max-height:250px;overflow:auto;}
.document-management-item{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;min-width:0;}
.document-management-item:hover{background:color-mix(in srgb,var(--accent) 7%,transparent);}
.document-management-item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
.document-management-item-meta{color:var(--muted);font-size:10px;flex:0 0 auto;}
.document-management-delete{flex:0 0 28px!important;width:28px!important;min-width:28px!important;height:26px!important;padding:0!important;border-radius:7px!important;}
.document-management-box.collapsed .document-management-body{display:none!important;}
.document-management-box.collapsed .document-management-head{border-bottom:0;}
.imported-document-text{min-height:280px;width:100%;box-sizing:border-box}
.search-hit{
 background:#FFE58A!important;
 color:#20252B!important;
 border-radius:3px;
 padding:0 2px;
 box-decoration-break:clone;
 -webkit-box-decoration-break:clone;
 font-weight:600;
}
.search-note-preview{
 display:block;
 margin:0 0 6px 0;
 padding:4px 8px;
 border:1px solid var(--border);
 border-radius:6px;
 background:var(--surface);
 color:var(--muted);
 font-size:12px;
 line-height:1.5;
}
body[data-mode="night"] .search-hit{
 background:#8A7625!important;
 color:#FFF7D6!important;
}
body[data-mode="night"] .search-note-preview{
 background:var(--surface);
 color:var(--text);
}

/* V1.4.4 — offline theme system */
.theme-tools{display:flex;align-items:center;gap:5px;position:relative}
.theme-main-btn{white-space:nowrap}
.theme-mode-btn{min-width:72px}
.theme-picker{
 display:none;
 position:absolute;
 top:calc(100% + 7px);
 right:0;
 z-index:30;
 width:330px;
 padding:10px;
 border:1px solid var(--border);
 border-radius:12px;
 background:var(--surface);
 box-shadow:0 10px 30px var(--shadow);
}
.theme-picker.open{display:block}
.theme-picker-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.theme-picker-title{font-weight:600}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.theme-option{
 display:flex;align-items:center;gap:7px;
 width:100%;text-align:left;
 border:1px solid var(--border);
 background:var(--surface2);
 border-radius:9px;
 padding:7px 8px;
}
.theme-option:hover{background:var(--hover);transform:none}
.theme-option.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-swatch{width:28px;height:28px;border-radius:7px;flex:none;border:1px solid rgba(127,127,127,.25)}
.theme-info{min-width:0}
.theme-name{display:block;font-size:12px;font-weight:600}
.theme-stars{display:block;font-size:11px;letter-spacing:0}
.theme-sub{display:block;color:var(--muted);font-size:10px;margin-top:1px}
.theme-picker-foot{
 margin-top:9px;padding-top:8px;border-top:1px solid var(--border2);
 display:flex;gap:5px;align-items:center
}
.theme-mode{
 flex:1;display:flex;gap:5px
}
.theme-mode button{flex:1;padding:5px 7px}
.theme-mode button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* V1.4.6 — real selectable palettes + compact header */
.brand-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 width:100%;
}
.brand-row{width:100%;min-height:40px;margin:0 0 10px}
.brand-row h2{margin:0;font-size:22px;white-space:nowrap}
.brand-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.brand-actions > button{flex:none;height:36px}
.brand-actions #refresh{width:40px;padding:5px!important}
.brand-actions #navToggle{width:auto;min-width:82px;padding:5px 10px!important}
.brand-actions #navToggle .ui-icon{margin-right:3px}
body{
 --bg:#e9e7e2;--app:#e9e7e2;--surface:#f6f6f4;--surface2:#f0efec;--nav:#e9e7e2;
 --header:#e9e7e2;--text:#30302f;--text2:#45433f;--muted:#77736b;
 --border:#d0cdc6;--border2:#ddd9d1;--hover:#e6e3dc;--accent:#5d5b55;
 --danger:#c44747;--star:#e4c95b;--shadow:rgba(35,33,29,.12);
}
/* DAY: each theme has its own recognizable palette */
body[data-mode="day"][data-theme="nord"]{
 --bg:#eceff4;--app:#e5e9f0;--surface:#f8f9fb;--surface2:#eef1f5;--nav:#e9edf3;
 --header:#e5e9f0;--text:#2e3440;--text2:#434c5e;--muted:#697586;
 --border:#c9d0da;--border2:#d8dde5;--hover:#dfe5ed;--accent:#5e81ac;
 --danger:#bf616a;--star:#d08770;--shadow:rgba(46,52,64,.12);
}
body[data-mode="day"][data-theme="atom"]{
 --bg:#f3f4f6;--app:#eef0f3;--surface:#ffffff;--surface2:#f7f8fa;--nav:#eef0f3;
 --header:#eef0f3;--text:#30343b;--text2:#4b5260;--muted:#737b88;
 --border:#d4d8de;--border2:#e4e7eb;--hover:#e9edf1;--accent:#3b82c4;
 --danger:#c94b55;--star:#c7922e;--shadow:rgba(0,0,0,.10);
