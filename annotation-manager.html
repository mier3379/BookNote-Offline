<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookNote · 标记库</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;color:#2e2925;background:#f5f1ec;--surface:#fff;--border:#ddd4cb;--muted:#81786f;--accent:#8b5cf6;--hover:#f0ebe6;--danger:#b42318}*{box-sizing:border-box}body{margin:0}.header{position:sticky;top:0;z-index:10;background:rgba(245,241,236,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:15px 20px}.top{display:flex;align-items:center;gap:9px}.title{font-size:20px;font-weight:750}.sub{font-size:11px;color:var(--muted)}button,select,input{font:inherit}button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;color:inherit}button:hover{background:var(--hover)}button.danger{color:var(--danger)}.spacer{flex:1}.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) 150px 150px 150px;gap:8px;margin-top:12px}.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:0 10px}.search input{border:0;outline:0;background:transparent;width:100%;padding:9px 0}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 9px;font-size:11px}.chip.active{background:#ebe2ff;border-color:#cbb6ff}.main{padding:18px 20px 50px;max-width:1180px;margin:auto}.summary{display:flex;align-items:center;gap:8px;margin:5px 0 12px;font-size:12px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:8px}.item{display:grid;grid-template-columns:36px 1fr auto;gap:11px;align-items:start;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px}.item.selected{outline:2px solid var(--accent)}.icon{font-size:21px;text-align:center}.body{min-width:0}.book{font-size:13px;font-weight:700}.meta{font-size:11px;color:var(--muted);margin-top:3px}.text{font-size:12px;line-height:1.55;margin-top:7px;white-space:pre-wrap}.note{font-size:12px;margin-top:6px;padding:7px 9px;background:var(--hover);border-radius:7px;white-space:pre-wrap}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font-size:10px;background:#eee8ff;border-radius:10px;padding:3px 7px}.actions{display:flex;gap:5px}.actions button{font-size:11px}.selection{display:none;position:sticky;top:88px;z-index:9;background:var(--surface);border:1px solid var(--border);padding:8px;border-radius:9px;margin-bottom:10px;box-shadow:0 4px 16px #0001;align-items:center;gap:7px}.selection.open{display:flex}.selection strong{margin-right:auto}.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;background:var(--surface)}@media(max-width:800px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.item{grid-template-columns:30px 1fr}.actions{grid-column:2}.main{padding-left:12px;padding-right:12px}}
</style></head><body><header class="header"><div class="top"><button id="back">‹</button><div><div class="title">🗂️ 标记库</div><div class="sub" id="count">0 条标记</div></div><span class="spacer"></span><button id="selectAll">☑️ 批量选择</button><button id="exportAll">📤 导出全部</button></div><div class="toolbar"><label class="search">🔎<input id="search" placeholder="搜索原文、笔记、标签、章节…"></label><select id="book"><option value="all">全部书籍</option></select><select id="type"><option value="all">全部类型</option><option value="highlight">🟡 高亮</option><option value="bookmark">🔖 书签</option><option value="quote">✂️ 摘录</option><option value="note">📝 笔记</option></select><select id="time"><option value="all">全部时间</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="365">最近一年</option></select></div></header><main class="main"><div class="selection" id="selection"><strong id="selCount">已选择 0 条</strong><button id="clearSel">取消</button><button id="exportSel">📤 导出所选</button><button id="deleteSel" class="danger">🗑 删除所选</button></div><div class="summary"><strong id="shown">0</strong><span>条结果</span></div><div id="list"></div></main><script src="js/booknote-annotations.js"></script><script src="annotation-manager.js"></script></body></html>
