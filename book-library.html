<style>

ke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.search-submit:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

.main{padding:18px 24px 50px}.summary{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin-bottom:12px}.summary strong{color:var(--text2)}
.shelf-section{margin-bottom:22px}.section-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}.section-head h2{font-size:15px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.section-head .more{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer}.recent-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;overflow:auto;padding-bottom:3px}.recent-card{display:grid;grid-template-columns:54px 1fr;gap:9px;min-width:190px;padding:9px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer}.recent-cover{width:54px;height:72px;border-radius:5px;object-fit:cover;background:var(--hover);display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden}.recent-cover img{width:100%;height:100%;object-fit:cover}.recent-title{font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.recent-meta{font-size:10px;color:var(--muted);margin-top:4px}.mini-progress{height:4px;background:var(--border2);border-radius:4px;overflow:hidden;margin-top:8px}.mini-progress i{display:block;height:100%;background:var(--accent)}
.selectionbar{display:none;position:sticky;top:111px;z-index:20;padding:8px 10px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 5px 15px var(--shadow);align-items:center;gap:7px}.selectionbar.open{display:flex}.selectionbar .selected-count{font-weight:650;margin-right:auto}.selectionbar select{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 9px}.selectionbar .danger{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:17px}.grid.list{display:flex;flex-direction:column;gap:8px}.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px var(--shadow);min-width:0;cursor:grab}.card:active{cursor:grabbing}.card.selected{outline:2px solid var(--accent);outline-offset:1px}.cover-wrap{height:245px;background:linear-gradient(135deg,#eee6dd,#d9cbbd);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.cover{width:100%;height:100%;object-fit:cover}.placeholder{font-size:56px;opacity:.62}.select-check{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:rgba(35,30,26,.6);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;cursor:pointer}.card:hover .select-check,.card.selected .select-check{opacity:1}.status-pill{position:absolute;right:8px;top:8px;padding:4px 7px;border-radius:12px;background:rgba(255,255,255,.88);font-size:10px;color:var(--text2)}
.card-body{padding:10px 11px}.book-title{font-weight:700;line-height:1.35;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.author{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap}.badge{font-size:10px;padding:3px 6px;border-radius:10px;background:var(--hover);color:var(--text2)}.time{font-size:10px;color:var(--muted);margin-left:auto}.progress{height:5px;border-radius:5px;background:var(--border2);overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--accent)}.progress-row{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr 34px;gap:5px;margin-top:9px}.actions button{border:1px solid var(--border);background:var(--surface2);border-radius:7px;padding:6px 5px;color:var(--text);cursor:pointer}.actions button:hover{background:var(--hover)}.actions .danger{color:var(--danger)}
.grid.list .card{display:grid;grid-template-columns:82px minmax(0,1fr);min-height:112px}.grid.list .cover-wrap{height:112px}.grid.list .placeholder{font-size:35px}.grid.list .card-body{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(130px,1fr) minmax(130px,1fr);align-items:center;gap:10px;padding:10px 13px}.grid.list .book-title{min-height:0}.grid.list .meta{margin-top:0}.grid.list .progress{margin-top:0}.grid.list .progress-row{grid-column:2/3;margin-top:-4px}.grid.list .actions{grid-column:3/4;grid-row:1/3;margin-top:0}.grid.list .status-pill{top:7px;left:7px;right:auto}
.search-history{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:80;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px var(--shadow);padding:7px;max-height:310px;overflow:auto}.search-history[hidden]{display:none}.search-history-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 7px;color:var(--muted);font-size:11px}.search-history-head button{border:0;background:transparent;color:var(--muted);cursor:pointer}.search-history-item{display:flex;width:100%;gap:8px;align-items:center;border:0;background:transparent;text-align:left;border-radius:7px;padding:8px 7px;color:var(--text);cursor:pointer}.search-history-item:hover{background:var(--hover)}.search-history-empty{padding:13px 7px;color:var(--muted);font-size:11px}.search-hit-mark{padding:0 2px;border-radius:3px;background:rgba(250,204,21,.45);color:inherit}.search-results{margin:0 0 20px}.search-results-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.search-results-action-group{display:flex;align-items:center;gap:5px;padding:3px 5px;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}.search-results-action-group b{font-size:11px;color:var(--muted);font-weight:600}.search-results-action-group.save{border-color:rgba(90,130,70,.45)}.search-results-head button{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:inherit;padding:6px 10px;cursor:pointer}.search-results-head button:disabled{opacity:.45;cursor:not-allowed}.search-results-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.search-results-head strong{font-size:14px}.search-results-list{display:flex;flex-direction:column;gap:7px}.search-result{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:default}.search-result:hover{background:var(--surface)}.search-result-icon{font-size:20px;text-align:center}.search-result-main{min-width:0}.search-result-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search-result-meta{font-size:11px;color:var(--muted);margin-top:3px}.search-result-snippet{font-size:12px;line-height:1.5;margin-top:5px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.search-result-book{font-size:11px;color:var(--muted);white-space:nowrap}.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px;background:var(--surface)}.empty strong{display:block;color:var(--text2);font-size:16px;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(30,25,22,.28);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}.modal[hidden]{display:none}.dialog{width:min(660px,100%);max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.dialog-head{padding:14px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:center}.dialog-head strong{font-size:16px}.dialog-head button{margin-left:auto;border:0;background:transparent;font-size:20px;padding:2px 7px}.detail{padding:16px;display:grid;grid-template-columns:130px 1fr;gap:16px}.detail-cover{width:130px;height:180px;border-radius:8px;object-fit:cover;background:var(--hover);display:flex;align-items:center;justify-content:center;font-size:48px}.detail dl{margin:0}.detail dt{font-size:11px;color:var(--muted);margin-top:9px}.detail dt:first-child{margin-top:0}.detail dd{margin:2px 0 0;line-height:1.45;word-break:break-word}.dialog-foot{padding:12px 16px;border-top:1px solid var(--border2);display:flex;justify-content:flex-end;gap:7px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:rgba(45,38,33,.94);color:#fff;padding:9px 14px;border-radius:9px;font-size:12px;transition:.18s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.recent-row{grid-template-columns:repeat(3,minmax(190px,1fr))}.grid.list .card-body{grid-template-columns:1fr 1fr}.grid.list .actions{grid-column:2;grid-row:2}.grid.list .progress-row{grid-column:1}.selectionbar{top:108px}}
@media(max-width:650px){.header,.main{padding-left:12px;padding-right:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover-wrap{height:210px}.recent-row{display:flex}.detail{grid-template-columns:90px 1fr}.detail-cover{width:90px;height:130px}.grid.list .card{grid-template-columns:72px 1fr}.grid.list .cover-wrap{height:120px}.grid.list .card-body{display:block}.grid.list .actions{margin-top:8px}.grid.list .progress{margin-top:8px}}

.io-modal{position:fixed;inset:0;background:rgba(30,25,22,.32);display:flex;align-items:center;justify-content:center;padding:20px;z-index:120}
.io-modal[hidden]{display:none}
.io-dialog{width:min(760px,100%);height:min(620px,90vh);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-direction:column}
.io-head{height:52px;flex:0 0 52px;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid var(--border2);background:var(--surface2)}
.io-head strong{font-size:16px}.io-head button{margin-left:auto;border:0;background:transparent;font-size:22px;padding:4px 9px}.io-frame{border:0;display:block;width:100%;height:100%;background:var(--surface2)}

<style id="v710118-shelf-search-history-layout">
.toolbar .search-wrap{position:relative;flex:1 1 320px;min-width:220px;z-index:80;}
.toolbar .search-wrap>.search{width:100%;}
.toolbar .search-wrap>.search-history{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:100;display:block;margin:0;max-height:min(310px,55vh);overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:0 12px 30px var(--shadow);padding:7px;}
.toolbar .search-wrap>.search-history[hidden]{display:none!important;}
.toolbar .search-wrap>.search-history .search-history-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 7px;color:var(--muted);font-size:11px;}
.toolbar .search-wrap>.search-history .search-history-head button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 6px;}
.toolbar .search-wrap>.search-history .search-history-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;border-radius:7px;padding:8px 7px;color:var(--text);cursor:pointer;}
.toolbar .search-wrap>.search-history .search-history-item:hover{background:var(--hover);}
.toolbar .search-wrap>.search-history .search-history-empty{padding:13px 7px;color:var(--muted);font-size:11px;}
@media(max-width:760px){.toolbar .search-wrap{flex-basis:100%;min-width:0;}}
</style>

<body class="booting">
<div class="page">
